[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-agent"
dynamic = ["version"]
description = "Autonomous AI investment banking analyst: SEC filings to DCF model and pitch deck."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6,<7",
    "tenacity>=8.2,<10",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8",
    "ruff>=0.5,<1",
    "types-PyYAML",
]

[project.scripts]
ib-agent = "ib_agent.cli:app"

[tool.setuptools.dynamic]
version = { attr = "ib_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: hits real network services (opt-in with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ib_agent"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
